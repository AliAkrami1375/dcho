[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcho"
version = "0.1.0"
description = "Persian text-to-speech, built to run in real time on a CPU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["text-to-speech", "tts", "persian", "farsi", "speech-synthesis", "onnx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Persian",
  "Programming Language :: Python :: 3.10",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# The runtime is deliberately thin. Inference needs onnxruntime and numpy
# and nothing else - no torch, which is what keeps an install around 50 MB
# instead of two gigabytes.
dependencies = [
  "numpy>=1.24",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "soundfile>=0.12",
  "huggingface_hub>=0.28",
  "tensorboard>=2.16",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
dcho = "dcho.cli:main"

[tool.setuptools.packages.find]
include = ["dcho*"]

[tool.setuptools.package-data]
dcho = ["text/data/*.tsv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
